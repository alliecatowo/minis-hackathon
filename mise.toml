[tools]
pnpm = "latest"
uv = "latest"
node = "22"
python = "3.13"

[tasks.dev-backend]
run = "cd backend && uv run uvicorn app.main:app --reload --port 8000"
description = "Run FastAPI backend dev server"

[tasks.dev-frontend]
run = "cd frontend && pnpm dev"
description = "Run Next.js frontend dev server"

[tasks.dev]
depends = ["dev-backend", "dev-frontend"]
description = "Run both dev servers"

[tasks.test]
description = "Run all backend tests"
run = "cd backend && uv run pytest"

[tasks.test-unit]
description = "Run backend unit tests only"
run = "cd backend && uv run pytest tests/ -m 'not integration and not e2e' -x -q"

[tasks.test-integration]
description = "Run backend integration tests only (requires NEON_DATABASE_URL or local Postgres)"
run = "cd backend && uv run pytest tests/ -m integration -v"

[tasks.test-coverage]
description = "Run tests with coverage report"
run = "cd backend && uv run pytest --cov=app --cov-report=term-missing --cov-report=html"

[tasks.lint]
description = "Lint backend code"
run = "cd backend && uv run ruff check ."

[tasks.lint-fix]
description = "Lint and auto-fix backend code"
run = "cd backend && uv run ruff check --fix ."

[tasks.format]
description = "Format backend code"
run = "cd backend && uv run ruff format ."

[tasks.typecheck]
description = "Type check frontend"
run = "cd frontend && pnpm tsc --noEmit"

[tasks.build]
description = "Build frontend for production"
run = "cd frontend && pnpm build"

[tasks.migrate]
description = "Run database migrations"
run = "cd backend && uv run alembic upgrade head"

[tasks.migrate-create]
description = "Create a new migration"
run = "cd backend && uv run alembic revision --autogenerate -m"

[tasks.db-reset]
description = "Reset database (stamp + upgrade)"
run = "cd backend && uv run alembic stamp head"

[tasks.health]
description = "Check if backend is healthy"
run = "curl -s http://localhost:8000/api/health | python3 -m json.tool"

[tasks.logs]
description = "Tail backend logs"
run = "tail -f backend/logs/app.log 2>/dev/null || echo 'No log file yet — start the backend first'"

[tasks.setup-hooks]
description = "Install Lefthook git hooks"
run = "lefthook install"

# ── Pipeline tasks (run directly against Neon, no HTTP) ───────────────────────

[tasks.regen]
description = "Regenerate a mini in-place (shows stage progress). Supports --mode, --run-id, --timeout, --json, --sources, --resume, --force-github-reingest."
run = "cd backend && PYTHONUNBUFFERED=1 PYTHONPATH=. uv run python scripts/regen_mini.py"

[tasks.ingest-run]
description = "Run ingest/regen with run contract output. Usage: mise run ingest-run <username> [-- --mode incremental|fresh|full --run-id <id> --timeout <s> --json]"
run = "cd backend && PYTHONUNBUFFERED=1 PYTHONPATH=. uv run python scripts/regen_mini.py"

[tasks.ingest-full]
description = "Run true full GitHub reingest (bypass incremental skip + clear cache), then full regen. Usage: mise run ingest-full <username> [-- --run-id <id> --json]"
run = "cd backend && PYTHONUNBUFFERED=1 PYTHONPATH=. uv run python scripts/regen_mini.py --mode full"

[tasks.ingest-resume]
description = "Resume-style regen without replacing prior explorer rows. Usage: mise run ingest-resume <username> [-- --run-id <id> --json]"
run = "cd backend && PYTHONUNBUFFERED=1 PYTHONPATH=. uv run python scripts/regen_mini.py --mode incremental --resume"

[tasks.ingest-status]
description = "Show latest ingest/run status with terminal stop reasons. Usage: mise run ingest-status <username> [-- --run-id <id> --watch --interval 10 --json]"
run = "cd backend && PYTHONUNBUFFERED=1 PYTHONPATH=. uv run python scripts/ingest_status.py"

[tasks.ingest-quick-check]
description = "Run lightweight post-ingest checks for a mini. Usage: mise run ingest-quick-check <username>"
run = "cd backend && PYTHONUNBUFFERED=1 PYTHONPATH=. uv run python scripts/ingest_quick_check.py"

[tasks.ingest-github-archive]
description = "Manual GitHub migration archive ingest. Usage: mise run ingest-github-archive <username> -- --path /path/archive.tar.gz [--dry-run] [--json]"
run = "cd backend && PYTHONUNBUFFERED=1 PYTHONPATH=. uv run python scripts/ingest_github_archive.py"

[tasks.regen-anthropic]
description = "Regenerate a mini with DEFAULT_PROVIDER=anthropic. Usage: mise run regen-anthropic <username>"
run = "cd backend && DEFAULT_PROVIDER=anthropic PYTHONPATH=. uv run python scripts/regen_mini.py"

[tasks.fidelity-eval]
description = "Run fidelity eval against a running backend. Usage: mise run fidelity-eval [subjects]"
run = "cd backend && uv run python scripts/run_fidelity_eval.py --base-url http://localhost:8000"

[tasks.fidelity-test]
description = "Quick voice-fidelity probe against a mini (Anthropic + judge)."
run = "cd backend && uv run python scripts/fidelity_test.py"

[tasks.prompt-diff]
description = "A/B prompt mutation against current Neon data (cheap validator)."
run = "cd backend && uv run python scripts/prompt_diff_test.py"

[tasks.neon-branch]
description = "Create a personal Neon dev branch. Usage: mise run neon-branch <branch-name>"
run = "neonctl branches create --name"

[tasks.pipeline-replay]
description = "Replay pipeline cassette fixtures offline."
run = "cd backend && MINIS_CASSETTE_MODE=replay MINIS_CASSETTE_RUN_ID=default uv run pytest tests/test_pipeline_replay.py -v"

[tasks.pipeline-record]
description = "One-time cassette recording guide: MINIS_CASSETTE_MODE=record OPENAI_API_KEY=... then run the target pipeline command."
run = "echo 'Set MINIS_CASSETTE_MODE=record MINIS_CASSETTE_RUN_ID=<run-id> OPENAI_API_KEY=... and run the pipeline once to capture fixtures.'"

[tasks.sprint-status]
description = "Print concise sprint status: branch, PRs, CD runs, regen processes, API health"
run = """
echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
echo "🎯 SPRINT STATUS"
echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
echo ""
echo "📍 BRANCH"
echo "  $(git rev-parse --abbrev-ref HEAD) | $(git rev-list --left-right --count main...HEAD | awk '{print "+" $2 " -" $1 " vs main"}')"
echo ""
echo "🌳 WORKTREES"
WORKTREE_COUNT=$(git worktree list 2>/dev/null | grep -v '^.*detached' | wc -l)
echo "  $((WORKTREE_COUNT - 1)) active ($(git worktree list 2>/dev/null | tail -n +2 | head -3 | awk '{print $1}' | xargs -I {} basename {} | paste -sd, -))"
echo ""
echo "📤 PULL REQUESTS (open)"
gh pr list --state open -L 8 --json number,title,author,createdAt --template '{{range .}}  [#{{.number}}] {{.title}} (@{{.author.login}}){{"\n"}}{{end}}' 2>/dev/null || echo "  (gh CLI unavailable)"
echo ""
echo "🚀 CD RUNS (recent)"
gh run list -w CD -L 3 --json status,createdAt,conclusion --template '{{range .}}  {{.status}} | {{.createdAt}} {{if .conclusion}}({{.conclusion}}){{end}}{{"\n"}}{{end}}' 2>/dev/null || echo "  (gh CLI unavailable)"
echo ""
echo "🔄 REGEN PROCESSES"
REGEN_PROCS=$(pgrep -af regen_mini.py 2>/dev/null | wc -l)
if [ "$REGEN_PROCS" -gt 0 ]; then
  pgrep -af regen_mini.py 2>/dev/null | head -3 | sed 's/^/  /'
else
  echo "  (none running)"
fi
echo ""
echo "🏥 API HEALTH (prod)"
API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://minis-api.fly.dev/api/minis/alliecatowo 2>/dev/null)
case $API_STATUS in
  200) echo "  ✓ minis-api.fly.dev/api/minis/alliecatowo: $API_STATUS" ;;
  *)   echo "  ✗ minis-api.fly.dev/api/minis/alliecatowo: $API_STATUS" ;;
esac
echo ""
echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
"""
